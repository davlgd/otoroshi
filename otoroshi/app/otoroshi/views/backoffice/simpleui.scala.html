@import otoroshi.models.BackOfficeUser
@import otoroshi.models.GlobalConfig
@import play.api.libs.json.Json

@(user: BackOfficeUser, config: GlobalConfig, _env: otoroshi.env.Env, version: String, possibleTenants: Seq[String], uiMode: String)

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>@_env.title - Simple UI</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no">
        <meta name="theme-color" content="#18181b">
        <meta name="robots" content="noindex, nofollow">
        <link rel="stylesheet" href="@routes.Assets.versioned("stylesheets/bootstrap.min.css")">
        <link rel="icon" type="image/png" href="@routes.Assets.versioned("images/favicon.png")">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@@400;500;600;700&display=swap" rel="stylesheet">
        <style>
            body {
                margin: 0;
                padding: 0;
            }
        </style>
    </head>
    <body class="@(uiMode)-mode" data-theme="@(if(uiMode == "light") "light" else "dark")">
        <div id="app"></div>
        @if(_env.liveJs) {
            <script src="http://localhost:3040/assets/javascripts/bundle/simpleui.js" type="text/javascript"></script>
        } else {
            <script type="text/javascript" src="@routes.Assets.versioned(s"javascripts/bundle/simpleui.js?v=${_env.hash}")"></script>
        }
        <script type="text/javascript">
            window.__title = '@_env.title';
            window.__env = '@_env.env';
            window.__userid = '@user.email';
            window.__currentVersion = '@version';
            window.__user = @Html(Json.stringify(user.toJson));
            window.__otoroshi__env__latest = {
                currentTenant: '@(possibleTenants.headOption.getOrElse("default"))',
                userAdmin: @(user.rights.superAdmin(_env)),
                bypassUserRightsCheck: false,
                otoroshiLogo: '/__otoroshi_assets/images/otoroshi-logo-color.png'
            };
            Otoroshi.initSimpleUI(document.getElementById("app"), window.__otoroshi__env__latest);
        </script>
    </body>
</html>
