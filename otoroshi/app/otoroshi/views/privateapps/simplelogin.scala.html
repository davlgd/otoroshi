@(_env: otoroshi.env.Env, redirect: Option[String], route: String, hash: Option[String])

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Simple Login - Otoroshi</title>
        <meta name="robots" content="noindex, nofollow">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" type="image/png" href="@routes.Assets.versioned("images/favicon.png")">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="@routes.Assets.versioned("stylesheets/bootstrap.min.css")">
        <link rel="stylesheet" media="screen" href="@routes.Assets.versioned("stylesheets/otoroshiapps.css")">
        <link href="@routes.Assets.versioned("fonts/font-awesome/css/fontawesome.min.css")" rel="stylesheet">
        <link href="@routes.Assets.versioned("fonts/raleway/raleway.css")" rel="stylesheet">
            @_env.providerCssUrlHtml
        <style>
            *, *::before, *::after {
                box-sizing: border-box;
            }
            body, html {
                margin: 0;
                padding: 0;
                min-height: 100vh;
                background-color: #09090b;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
            #app {
                min-height: 100vh;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        @if(_env.liveJs) {
            <script src="http://localhost:3040/assets/javascripts/bundle/simplelogin.js" type="text/javascript"></script>
        } else {
            <script type="text/javascript" src="@routes.Assets.versioned(s"javascripts/bundle/simplelogin.js?v=${_env.hash}")"></script>
        }
        <script>
                Otoroshi.simpleLogin({
                    redirect: '@redirect',
                    hash: '@hash',
                    route: '@route',
                    otoroshiLogo: '@(_env.otoroshiLogo)'
                }, document.getElementById("app"));
        </script>
        @_env.providerJsUrlHtml
    </body>
</html>
